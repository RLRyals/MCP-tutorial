# Docker Compose configuration for MCP Tutorial with Typing Mind
# This file configures MCP servers to run in HTTP mode for Typing Mind integration

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: mcp-tutorial-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-book_series_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=100"
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=16MB"
    volumes:
      - mcp_tutorial_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only for security
    networks:
      - mcp-tutorial-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-book_series_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Author MCP Server - HTTP Mode
  mcp-author-http:
    image: mcp-tutorial:latest
    container_name: mcp-tutorial-author-http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-book_series_db}
      NODE_ENV: ${NODE_ENV:-production}
      MCP_HTTP_MODE: "true"
    ports:
      - "127.0.0.1:3501:3501"  # Bind to localhost only
    networks:
      - mcp-tutorial-network
    command: ["node", "src/mcps/author-server/index.js", "--http", "--port", "3501"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3501/health"]
      interval: 30s
      timeout: 3s
      retries: 3

