services:
  # ========================================
  # MCP Connector (runs all MCP servers)
  # Connects to existing database: mcp-series-db-2
  # ========================================
  mcp-connector:
    build:
      context: ../..
      dockerfile: distribution/docker/Dockerfile.mcp-connector
    image: mcp-writing-connector:latest
    container_name: mcp-connector
    restart: unless-stopped
    environment:
      # MCP Connector authentication
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN}
      PORT: ${MCP_CONNECTOR_PORT:-50880}

      # Database connection (uses existing container name)
      DATABASE_URL: postgresql://${POSTGRES_USER:-writer}:${POSTGRES_PASSWORD}@${POSTGRES_CONTAINER_NAME:-mcp-series-db-2}:5432/${POSTGRES_DB:-mcp_series}
      POSTGRES_HOST: ${POSTGRES_CONTAINER_NAME:-mcp-series-db-2}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-mcp_series}
      POSTGRES_USER: ${POSTGRES_USER:-writer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # MCP server configuration
      NODE_ENV: ${NODE_ENV:-development}
      INCLUDE_AUTHOR_SERVER: ${INCLUDE_AUTHOR_SERVER:-true}
      MCP_STDIO_MODE: 'false'
    ports:
      - "${MCP_CONNECTOR_PORT:-50880}:50880"
    volumes:
      # Mount source as read-only for development
      - ../../src:/app/src:ro
      - ../../migrations:/app/migrations:ro
      # Preserve node_modules in container
      - /app/node_modules
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:50880/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  # ========================================
  # Typing Mind Static Web Server (Optional)
  # Uncomment to enable built-in web server
  # ========================================
  # typing-mind-web:
  #   image: nginx:alpine
  #   container_name: typing-mind-web
  #   restart: unless-stopped
  #   ports:
  #     - "${TYPING_MIND_PORT:-3000}:80"
  #   volumes:
  #     - ${TYPING_MIND_DIR:-./typing-mind-static}:/usr/share/nginx/html:ro
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   networks:
  #     - mcp-network
  #   healthcheck:
  #     test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
  #     interval: 30s
  #     timeout: 3s
  #     retries: 3

networks:
  mcp-network:
    name: mcp-series-network
    external: true
